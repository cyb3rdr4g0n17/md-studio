<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MD Studio Pro - A lightweight, privacy-focused, zero-backend Markdown editor and document publisher with live KaTeX math, Mermaid diagrams, GFM callouts, Word (.docx), and pristine Vector PDF export.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<title>MD Studio Pro – Markdown to PDF & DOCX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
/* ==========================================================================
   MD STUDIO PRO - MODERN DESIGN SYSTEM & TOKENS
   ========================================================================== */
:root {
  --font-ui: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  --font-serif: 'Lora', Georgia, serif;
  
  /* Dark Theme Tokens (Default) */
  --bg-app: #0d1117;
  --bg-surface: #161b22;
  --bg-surface-elevated: #21262d;
  --bg-toolbar: rgba(22, 27, 34, 0.85);
  --border-subtle: #30363d;
  --border-strong: #484f58;
  --text-main: #f0f6fc;
  --text-muted: #8b949e;
  --text-dim: #6e7681;
  
  --accent-primary: #6366f1;
  --accent-primary-hover: #4f46e5;
  --accent-primary-glow: rgba(99, 102, 241, 0.25);
  --accent-secondary: #06b6d4;
  --accent-success: #10b981;
  --accent-warning: #f59e0b;
  --accent-danger: #ef4444;
  
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 14px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 30px rgba(0,0,0,0.5);
  --paper-shadow: 0 15px 40px rgba(0,0,0,0.45);
  
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-full: 9999px;
  
  --header-height: 56px;
  --ribbon-height: 44px;
  --statusbar-height: 30px;
  --panel-backdrop: blur(12px);
}

[data-theme="light"] {
  --bg-app: #f4f6f8;
  --bg-surface: #ffffff;
  --bg-surface-elevated: #f8fafc;
  --bg-toolbar: rgba(255, 255, 255, 0.9);
  --border-subtle: #e2e8f0;
  --border-strong: #cbd5e1;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-dim: #94a3b8;
  
  --accent-primary: #4f46e5;
  --accent-primary-hover: #4338ca;
  --accent-primary-glow: rgba(79, 70, 229, 0.15);
  --paper-shadow: 0 12px 36px rgba(0,0,0,0.12);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-ui);
  background: var(--bg-app);
  color: var(--text-main);
  line-height: 1.5;
  font-size: 13.5px;
  overflow: hidden;
  height: 100vh;
  display: flex;
  flex-direction: column;
  -webkit-font-smoothing: antialiased;
}

/* ==========================================================================
   HEADER NAVIGATION
   ========================================================================== */
header.app-header {
  height: var(--header-height);
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  gap: 12px;
  z-index: 40;
  position: relative;
  flex-shrink: 0;
}

.brand-section {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: -0.02em;
  color: var(--text-main);
  text-decoration: none;
  user-select: none;
}

.logo-icon {
  width: 28px;
  height: 28px;
  background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: 0 2px 8px var(--accent-primary-glow);
}

.badge-pill {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 2px 6px;
  border-radius: var(--radius-full);
  background: var(--accent-primary-glow);
  color: var(--accent-primary);
  border: 1px solid var(--accent-primary);
  letter-spacing: 0.05em;
}

.doc-title-input {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text-main);
  font-size: 13.5px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: var(--radius-sm);
  max-width: 260px;
  transition: all 0.2s;
  outline: none;
}

.doc-title-input:hover {
  border-color: var(--border-subtle);
  background: var(--bg-surface-elevated);
}

.doc-title-input:focus {
  border-color: var(--accent-primary);
  background: var(--bg-surface-elevated);
  box-shadow: 0 0 0 2px var(--accent-primary-glow);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* ==========================================================================
   BUTTONS & CONTROLS
   ========================================================================== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  font-weight: 500;
  font-family: var(--font-ui);
  cursor: pointer;
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  color: var(--text-main);
  transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  user-select: none;
  white-space: nowrap;
}

.btn:hover {
  border-color: var(--border-strong);
  background: var(--border-subtle);
  transform: translateY(-1px);
}

.btn:active {
  transform: translateY(0);
}

.btn-primary {
  background: var(--accent-primary);
  border-color: var(--accent-primary);
  color: #ffffff !important;
  font-weight: 600;
  box-shadow: 0 2px 8px var(--accent-primary-glow);
}

.btn-primary:hover {
  background: var(--accent-primary-hover);
  border-color: var(--accent-primary-hover);
  box-shadow: 0 4px 12px var(--accent-primary-glow);
}

.btn-icon-only {
  padding: 6px;
  width: 32px;
  height: 32px;
}

.btn-group {
  display: inline-flex;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid var(--border-subtle);
}

.btn-group .btn {
  border: none;
  border-radius: 0;
  border-right: 1px solid var(--border-subtle);
}

.btn-group .btn:last-child {
  border-right: none;
}

.btn.active {
  background: var(--accent-primary);
  color: #fff;
}

/* Dropdown Menu */
.dropdown {
  position: relative;
  display: inline-block;
}

.dropdown-menu {
  position: absolute;
  top: calc(100% + 6px);
  right: 0;
  min-width: 190px;
  background: var(--bg-surface);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  display: none;
  flex-direction: column;
  gap: 2px;
  z-index: 100;
  backdrop-filter: var(--panel-backdrop);
}

.dropdown.open .dropdown-menu {
  display: flex;
}

.dropdown-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  color: var(--text-main);
  font-size: 12.5px;
  text-decoration: none;
  cursor: pointer;
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  transition: all 0.15s;
}

.dropdown-item:hover {
  background: var(--bg-surface-elevated);
  color: var(--accent-primary);
}

.dropdown-divider {
  height: 1px;
  background: var(--border-subtle);
  margin: 4px 0;
}

/* ==========================================================================
   FORMATTING RIBBON & TOOLS
   ========================================================================== */
.app-ribbon {
  height: var(--ribbon-height);
  background: var(--bg-surface-elevated);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 8px;
  overflow-x: auto;
  white-space: nowrap;
  flex-shrink: 0;
  user-select: none;
}

.ribbon-group {
  display: flex;
  align-items: center;
  gap: 3px;
  padding-right: 8px;
  border-right: 1px solid var(--border-subtle);
}

.ribbon-group:last-child {
  border-right: none;
  padding-right: 0;
}

.ribbon-btn {
  padding: 5px 8px;
  height: 28px;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
  transition: all 0.15s;
}

.ribbon-btn:hover {
  background: var(--bg-surface);
  border-color: var(--border-subtle);
  color: var(--text-main);
}

.ribbon-btn:active {
  background: var(--border-subtle);
}

.ribbon-select {
  height: 28px;
  padding: 0 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface);
  color: var(--text-main);
  font-size: 12px;
  font-family: var(--font-ui);
  outline: none;
  cursor: pointer;
}

.ribbon-select:focus {
  border-color: var(--accent-primary);
}

/* ==========================================================================
   MAIN WORKSPACE SPLIT (EDITOR & PREVIEW)
   ========================================================================== */
main.workspace {
  display: grid;
  grid-template-columns: 1fr 1fr;
  flex: 1;
  overflow: hidden;
  position: relative;
}

main.workspace.view-editor {
  grid-template-columns: 1fr 0;
}

main.workspace.view-editor .preview-pane {
  display: none;
}

main.workspace.view-preview {
  grid-template-columns: 0 1fr;
}

main.workspace.view-preview .editor-pane {
  display: none;
}

/* Pane Header */
.pane-header {
  height: 32px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  flex-shrink: 0;
}

.pane-header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Editor Pane */
.editor-pane {
  display: flex;
  flex-direction: column;
  background: var(--bg-surface);
  border-right: 1px solid var(--border-subtle);
  overflow: hidden;
  height: 100%;
}

.editor-container {
  flex: 1;
  position: relative;
  overflow: hidden;
}

#src {
  width: 100%;
  height: 100%;
  border: none;
  outline: none;
  resize: none;
  padding: 16px 20px;
  background: var(--bg-surface);
  color: var(--text-main);
  font-family: var(--font-mono);
  font-size: 13.5px;
  line-height: 1.6;
  tab-size: 2;
  overflow-y: auto;
  white-space: pre-wrap;
  word-wrap: break-word;
}

#src::placeholder {
  color: var(--text-dim);
}

/* Preview Pane */
.preview-pane {
  display: flex;
  flex-direction: column;
  background: #1e1e24;
  overflow: hidden;
  height: 100%;
}

[data-theme="light"] .preview-pane {
  background: #e2e8f0;
}

.preview-scroll-wrapper {
  flex: 1;
  overflow-y: auto;
  padding: 30px 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  scroll-behavior: smooth;
}

/* ==========================================================================
   DOCUMENT PAPER & PRINT RENDERER (ALWAYS HIGH CONTRAST / PAPER AESTHETICS)
   ========================================================================== */
.paper-container {
  width: 100%;
  max-width: 820px;
  display: flex;
  flex-direction: column;
  margin: 0 auto;
}

.hf-bar {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  padding: 6px 12px;
  font-size: 10.5px;
  color: #71717a;
  max-width: 820px;
  margin: 0 auto;
  width: 100%;
  user-select: none;
}
.hf-bar span:nth-child(2) { text-align: center; }
.hf-bar span:nth-child(3) { text-align: right; }

.paper {
  background: #ffffff;
  color: var(--doc-txt, #1f2937);
  padding: 50px 60px;
  border-radius: 4px;
  box-shadow: var(--paper-shadow);
  line-height: var(--doc-lh, 1.7);
  font-size: var(--doc-fs, 14.5px);
  font-family: var(--doc-ff, 'Plus Jakarta Sans', sans-serif);
  word-break: break-word;
  min-height: 1050px;
  transition: all 0.2s;
  position: relative;
}

/* Document Typography & Elements */
.paper h1, .paper h2, .paper h3, .paper h4, .paper h5 {
  color: var(--doc-hd, #111827);
  font-weight: 700;
  line-height: 1.3;
  margin: 1.6em 0 0.6em;
  break-inside: avoid;
  page-break-inside: avoid;
}

.paper h1:first-child { margin-top: 0; }
.paper h1 { font-size: 2.2em; border-bottom: 2px solid var(--doc-acc, #6366f1); padding-bottom: 0.3em; }
.paper h2 { font-size: 1.6em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.25em; }
.paper h3 { font-size: 1.25em; }
.paper h4 { font-size: 1.05em; }

.paper p { margin-bottom: 1.1em; }
.paper ul, .paper ol { margin: 0 0 1.2em 1.5em; }
.paper li { margin-bottom: 0.4em; }

.paper a { color: var(--doc-lk, #2563eb); text-decoration: underline; text-underline-offset: 2px; }
.paper strong { font-weight: 700; color: #111827; }
.paper em { font-style: italic; }

.paper hr {
  border: 0;
  height: 1px;
  background: #e5e7eb;
  margin: 2em 0;
}

.paper blockquote {
  border-left: 4px solid var(--doc-acc, #6366f1);
  padding: 8px 16px;
  margin: 1.2em 0;
  color: #4b5563;
  background: #f8fafc;
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  font-style: italic;
}

.paper table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.4em 0;
  font-size: 0.95em;
  break-inside: avoid;
}

.paper th, .paper td {
  border: 1px solid #e5e7eb;
  padding: 8px 12px;
  text-align: left;
}

.paper th {
  background: #f1f5f9;
  font-weight: 600;
  color: #1e293b;
}

.paper tr:nth-child(even) td {
  background: #fafafa;
}

.paper code:not([class*="language-"]) {
  font-family: var(--font-mono);
  font-size: 0.88em;
  background: #f1f5f9;
  color: #e11d48;
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid #e2e8f0;
}

.paper pre {
  margin: 1.2em 0;
  border-radius: var(--radius-sm);
  background: #1e1e2e !important;
  padding: 14px 18px;
  overflow-x: auto;
  border: 1px solid #313244;
  break-inside: avoid;
}

.paper pre code {
  font-family: var(--font-mono) !important;
  font-size: 13px !important;
  background: transparent !important;
  padding: 0 !important;
  border: none !important;
}

.paper img {
  max-width: 100%;
  height: auto;
  border-radius: var(--radius-sm);
  margin: 1.4em auto;
  display: block;
  box-shadow: 0 4px 14px rgba(0,0,0,0.06);
}

/* KaTeX Mathematical Formulas */
.paper .math-display {
  margin: 1.4em 0;
  text-align: center;
  overflow-x: auto;
  padding: 10px 0;
  break-inside: avoid;
  page-break-inside: avoid;
}

.paper .math-inline {
  display: inline-block;
  padding: 0 2px;
  vertical-align: -0.1em;
}

.paper .katex {
  font-size: 1.1em;
}

.paper .katex-display > .katex {
  text-align: center;
}

.paper .math-error {
  color: var(--accent-danger);
  background: #fef2f2;
  padding: 2px 6px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 0.9em;
}

/* Mermaid Diagrams */
.paper .mermaid-chart {
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 1.8em 0;
  padding: 16px;
  background: #fcfcfd;
  border: 1px solid #f1f5f9;
  border-radius: var(--radius-md);
  overflow-x: auto;
  break-inside: avoid;
  page-break-inside: avoid;
}

.paper .mermaid-chart svg {
  max-width: 100% !important;
  height: auto !important;
}

/* Editor Drag Over Active State */
.editor-pane.drag-active {
  border-color: var(--accent-primary) !important;
  box-shadow: inset 0 0 0 2px var(--accent-primary);
}

/* Callouts / Admonitions */
.paper .callout {
  padding: 12px 16px;
  margin: 1.2em 0;
  border-radius: var(--radius-sm);
  border-left: 4px solid;
  font-size: 0.95em;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.paper .callout-note { background: #eff6ff; border-color: #3b82f6; color: #1e3a8a; }
.paper .callout-tip { background: #ecfdf5; border-color: #10b981; color: #064e3b; }
.paper .callout-important { background: #f5f3ff; border-color: #8b5cf6; color: #4c1d95; }
.paper .callout-warning { background: #fffbeb; border-color: #f59e0b; color: #78350f; }
.paper .callout-caution { background: #fef2f2; border-color: #ef4444; color: #7f1d1d; }

.paper .callout-title {
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 6px;
  text-transform: uppercase;
  font-size: 0.82em;
  letter-spacing: 0.05em;
}

/* Page Break Divider in Editor */
.paper .page-break {
  border-top: 2px dashed #94a3b8;
  margin: 30px 0;
  position: relative;
  text-align: center;
}

.paper .page-break::after {
  content: 'PAGE BREAK';
  position: absolute;
  top: -9px;
  left: 50%;
  transform: translateX(-50%);
  background: #ffffff;
  padding: 0 10px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: #94a3b8;
}

/* Paper Theme Variations */
.paper.theme-classic {
  font-family: var(--font-serif);
  --doc-hd: #831843;
  --doc-acc: #831843;
}
.paper.theme-classic h1 { border-bottom-color: #831843; font-style: italic; }

.paper.theme-academic {
  font-family: 'Merriweather', Georgia, serif;
  text-align: justify;
  line-height: 1.85;
}
.paper.theme-academic h1 { text-align: center; border-bottom: none; }
.paper.theme-academic h2 { text-align: center; border-bottom: none; }

.paper.theme-minimal {
  font-family: var(--font-ui);
  --doc-hd: #0f172a;
  --doc-acc: #0ea5e9;
}
.paper.theme-minimal h1 { border-bottom: 3px solid #0ea5e9; }

/* ==========================================================================
   DRAWER / FLOATING SETTINGS PANEL
   ========================================================================== */
.settings-drawer {
  position: fixed;
  top: var(--header-height);
  right: 0;
  bottom: var(--statusbar-height);
  width: 340px;
  background: var(--bg-surface);
  border-left: 1px solid var(--border-subtle);
  box-shadow: var(--shadow-lg);
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  z-index: 50;
  overflow-y: auto;
  transform: translateX(100%);
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.settings-drawer.open {
  transform: translateX(0);
}

.drawer-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-subtle);
  padding-bottom: 12px;
}

.drawer-title {
  font-size: 14px;
  font-weight: 700;
}

.setting-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.setting-label {
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.setting-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.setting-row input[type="color"] {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  padding: 1px;
  background: var(--bg-surface-elevated);
  cursor: pointer;
}

.setting-row input[type="text"], .setting-row select {
  flex: 1;
  height: 32px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: var(--bg-surface-elevated);
  color: var(--text-main);
  font-size: 12.5px;
  outline: none;
}

.setting-row input[type="text"]:focus, .setting-row select:focus {
  border-color: var(--accent-primary);
}

/* ==========================================================================
   STATUS BAR
   ========================================================================== */
footer.app-statusbar {
  height: var(--statusbar-height);
  background: var(--bg-surface);
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  font-size: 11px;
  color: var(--text-muted);
  flex-shrink: 0;
  user-select: none;
}

.status-left, .status-right {
  display: flex;
  align-items: center;
  gap: 14px;
}

.status-item {
  display: flex;
  align-items: center;
  gap: 5px;
}

.status-indicator {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--accent-success);
}

/* Toast Notification */
#toast {
  position: fixed;
  bottom: calc(var(--statusbar-height) + 16px);
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: #1e293b;
  color: #f8fafc;
  border: 1px solid #334155;
  padding: 8px 18px;
  border-radius: var(--radius-full);
  font-size: 12.5px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 1000;
}

#toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

/* ==========================================================================
   PRINT MEDIA STYLESHEET (CLEAN VECTOR PDF GENERATION)
   ========================================================================== */
@media print {
  html, body {
    background: #ffffff !important;
    color: #111827 !important;
    overflow: visible !important;
    height: auto !important;
    min-height: auto !important;
    position: static !important;
    font-size: 11pt !important;
  }
  
  * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
  
  header.app-header,
  .app-ribbon,
  footer.app-statusbar,
  .editor-pane,
  .settings-drawer,
  .pane-header,
  #toast {
    display: none !important;
  }
  
  main.workspace {
    display: block !important;
    height: auto !important;
    overflow: visible !important;
    position: static !important;
  }
  
  .preview-pane {
    display: block !important;
    background: transparent !important;
    padding: 0 !important;
    overflow: visible !important;
    height: auto !important;
    position: static !important;
  }

  .preview-scroll-wrapper {
    background: transparent !important;
    padding: 0 !important;
    overflow: visible !important;
    height: auto !important;
    display: block !important;
    position: static !important;
  }
  
  .paper-container {
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    box-shadow: none !important;
  }
  
  .paper {
    box-shadow: none !important;
    padding: 0 !important;
    min-height: auto !important;
    max-width: 100% !important;
    width: 100% !important;
    color: #111827 !important;
  }
  
  .paper-container .hf-bar {
    display: none !important;
  }
  
  .paper .page-break {
    border: none !important;
    margin: 0 !important;
    page-break-after: always !important;
    break-after: page !important;
    height: 0 !important;
  }
  
  .paper .page-break::after {
    display: none !important;
  }
  
  h1, h2, h3, h4, tr, blockquote, pre, .callout, .paper .math-display, .paper .mermaid-chart, .paper img {
    break-inside: avoid !important;
    page-break-inside: avoid !important;
  }

  .paper .mermaid-chart {
    background: transparent !important;
    border: none !important;
    padding: 10px 0 !important;
  }

  h1, h2, h3 {
    break-after: avoid !important;
    page-break-after: avoid !important;
  }
  
  @page {
    size: auto;
    margin: 15mm 15mm 15mm 15mm;
  }
}
</style>

  // State
  let prevHistory = null;
  let renderTimer = null;

  const src = $('src');

  // Initialize Source Content
  try {

  // Initialize Mermaid

  // Toast Functionality
  function showToast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2500);
  }

  // Slugifier for Headings
  const slugify = s => s.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');

  // Mathematical Formula Processing (KaTeX)
  function protectMath(text) {
    const mathStorage = [];
    const codeBlocks = [];

    // Protect code blocks first so math inside normal code isn't touched
    text = text.replace(/(```[\s\S]*?```|`[^`\n]+`)/g, match => {
      // Except if it's explicitly ```math or ```latex
      const mathMatch = match.match(/^```(?:math|latex)\n([\s\S]*?)```$/);
      if (mathMatch) {
        const id = mathStorage.length;
        mathStorage.push({ expr: mathMatch[1].trim(), display: true });
        return `%%%MATH_BLOCK_${id}%%%`;
      }
      const ph = `%%%CODE_BLOCK_${codeBlocks.length}%%%`;
      codeBlocks.push(match);
      return ph;
    });

    // Block math: $$ ... $$
    text = text.replace(/\$\$([\s\S]*?)\$\$/g, (match, formula) => {
      const id = mathStorage.length;
      mathStorage.push({ expr: formula.trim(), display: true });
      return `\n\n%%%MATH_BLOCK_${id}%%%\n\n`;
    });

    // Inline math: $...$ (ensures not matching empty or newline or currency like $5)
    text = text.replace(/(^|[^\\])\$([^\$\s](?:[^\$]*?[^\$\s])?)\$/g, (match, prefix, formula) => {
      const id = mathStorage.length;
      mathStorage.push({ expr: formula.trim(), display: false });
      return `${prefix}%%%MATH_INLINE_${id}%%%`;
    });

    // Restore code blocks
    text = text.replace(/%%%CODE_BLOCK_(\d+)%%%/g, (m, id) => codeBlocks[Number(id)]);

    return { text, mathStorage };
  }

  function renderMathPlaceholders(html, mathStorage) {
    return html.replace(/%%%MATH_(BLOCK|INLINE)_(\d+)%%%/g, (match, type, id) => {
      const item = mathStorage[Number(id)];
      if (!item || !window.katex) return match;
      try {
        const rendered = katex.renderToString(item.expr, {
          displayMode: item.display,
          throwOnError: false
        });
        return item.display ? `<div class="math-display">${rendered}</div>` : `<span class="math-inline">${rendered}</span>`;
      } catch (err) {
        return `<code class="math-error">${escapeHtml(item.expr)}</code>`;
      }
    });
  }

  // Mermaid Diagram Renderer
  let mermaidCounter = 0;
  async function renderMermaidDiagrams() {
    if (!window.mermaid) return;
    const blocks = out.querySelectorAll('pre code.language-mermaid, pre code.language-flowchart');
    if (!blocks.length) return;

    for (const code of blocks) {
      const pre = code.closest('pre');
      if (!pre) continue;
      const chartDiv = document.createElement('div');
      chartDiv.className = 'mermaid-chart';
      const rawText = code.textContent.trim();
      pre.replaceWith(chartDiv);

      const id = `mmd-${Date.now()}-${++mermaidCounter}`;
      try {
        const { svg } = await mermaid.render(id, rawText);
        chartDiv.innerHTML = svg;
      } catch (err) {
        chartDiv.innerHTML = `<div class="math-error" style="text-align:left; font-family:var(--font-mono); font-size:12px; white-space:pre-wrap; padding:8px 12px; border-radius:4px;">Diagram error: ${escapeHtml(err.message || String(err))}</div>`;
        const errorEl = document.getElementById(id);
        if (errorEl) errorEl.remove();
        const errorSvg = document.getElementById('d' + id);
        if (errorSvg) errorSvg.remove();
      }
    }
  }

  // Transform GitHub alerts (> [!NOTE]) into styled callouts
  function parseCallouts(html) {
    const alertTypes = ['NOTE', 'TIP', 'IMPORTANT', 'WARNING', 'CAUTION'];
    alertTypes.forEach(type => {
      const reg = new RegExp(`<blockquote>\\s*<p>\\[\\!${type}\\]([\\s\\S]*?)<\\/p>([\\s\\S]*?)<\\/blockquote>`, 'gi');
      html = html.replace(reg, (match, firstLine, rest) => {
        return `<div class="callout callout-${type.toLowerCase()}">
          <div class="callout-title">${type}</div>
          <p>${firstLine.trim()}</p>
          ${rest || ''}
        </div>`;
      });
    });
    // Transform page breaks
    html = html.replace(/<!--\\s*pagebreak\\s*-->/gi, '<div class="page-break"></div>');
    return html;
  }

  // Render Markdown to Preview
  async function renderDocument() {
    marked.setOptions({
      gfm: true,
      breaks: false,
      headerIds: true,
      mangle: false
    });

    const { text, mathStorage } = protectMath(src.value);
    const rawHtml = marked.parse(text);
    const sanitizedHtml = DOMPurify.sanitize(rawHtml, {
      ADD_TAGS: ['div', 'span', 'b', 'i', 's', 'svg', 'path', 'g', 'polygon', 'polyline', 'rect', 'circle', 'line', 'text', 'defs', 'marker', 'style'],
      ADD_ATTR: ['class', 'style', 'id', 'data-theme', 'viewBox', 'd', 'fill', 'stroke', 'stroke-width', 'stroke-linecap', 'stroke-linejoin', 'transform', 'marker-end', 'width', 'height', 'x', 'y', 'x1', 'y1', 'x2', 'y2', 'cx', 'cy', 'r', 'rx', 'ry', 'points']
    });

    const parsedHtml = parseCallouts(sanitizedHtml);
    out.innerHTML = renderMathPlaceholders(parsedHtml, mathStorage);

    // Render Mermaid diagrams
    await renderMermaidDiagrams();

    // Apply Prism code highlighting
    if (window.Prism) {
      out.querySelectorAll('pre code:not(.language-mermaid):not(.language-flowchart)').forEach(el => Prism.highlightElement(el));
    }

    // Auto-id headings
    const seenSlugs = {};
    out.querySelectorAll('h1, h2, h3, h4').forEach(h => {
      let s = slugify(h.textContent) || 'section';
      seenSlugs[s] = (seenSlugs[s] || 0) + 1;
      h.id = seenSlugs[s] > 1 ? `${s}-${seenSlugs[s]}` : s;
    });

    // Update Auto-title from first H1 if title is default
    const firstH1 = out.querySelector('h1');
    if (firstH1 && docTitle.value === 'Document') {
      docTitle.value = firstH1.textContent.trim().slice(0, 32);
    }

    // Save state
    try {
      localStorage.setItem('mdstudio_content', src.value);
      localStorage.setItem('mdstudio_title', docTitle.value);
    } catch (e) {}

    updateStats();
    renderHeaderFooter();
  }

  // Text Stats & Page Count Calculation
  function updateStats() {
    const text = src.value.trim();
    const words = text ? (text.match(/\S+/g) || []).length : 0;
    const chars = text.length;
    const readingTime = Math.ceil(words / 200);

    $('statWords').textContent = `${words.toLocaleString()} words`;
    $('statChars').textContent = `${chars.toLocaleString()} characters`;
    $('statReadingTime').textContent = `${readingTime} min read`;

    // Estimate A4 pages (approx 1060px scrollHeight per printable page)
    const estPages = Math.max(1, Math.ceil(out.scrollHeight / 1050));
    const sizeName = $('pageSize').value.toUpperCase();
    $('pageCountDisplay').textContent = `${sizeName} • Approx ${estPages} ${estPages === 1 ? 'Page' : 'Pages'}`;
    $('statSave').textContent = 'Saved locally';
  }

  // Input debouncing
  src.addEventListener('input', () => {
    $('statSave').textContent = 'Editing…';
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderDocument, 120);
  });

  docTitle.addEventListener('change', () => {
    try { localStorage.setItem('mdstudio_title', docTitle.value); } catch(e){}
  });

  // ==========================================================================
  // RUNNING HEADERS, FOOTERS & PAGINATION
  // ==========================================================================
  const escapeHtml = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const fillPageNos = (template, n, total) => template.replace(/\{n\}/g, n).replace(/\{N\}/g, total);

  function getHFLayout() {
    const header = { L: '', C: $('inpHeaderTxt').value, R: '' };
    const footer = { L: $('inpFooterTxt').value, C: '', R: '' };
    const pos = $('selPageNoPos').value;
    const fmt = $('selPageNoFmt').value;

    if (pos === 'bl') { footer.R = footer.L; footer.L = fmt; }
    else if (pos === 'bc') { footer.C = fmt; }
    else if (pos === 'br') { footer.R = fmt; }
    else if (pos === 'tr') { header.R = fmt; }

    return { header, footer };
  }

  function renderHeaderFooter() {
    const { header, footer } = getHFLayout();
    const totalPages = Math.max(1, Math.ceil(out.scrollHeight / 1050));

    [['headerPreview', header], ['footerPreview', footer]].forEach(([elId, obj]) => {
      const el = $(elId);
      const hasContent = obj.L || obj.C || obj.R;
      if (hasContent) {
        el.style.display = 'grid';
        el.innerHTML = ['L', 'C', 'R'].map(k => `<span>${escapeHtml(fillPageNos(obj[k], 1, totalPages))}</span>`).join('');
      } else {
        el.style.display = 'none';
      }
    });
  }

  ['inpHeaderTxt', 'inpFooterTxt', 'selPageNoPos', 'selPageNoFmt', 'chkHideFirstPage'].forEach(id => {
    $(id).addEventListener('input', renderHeaderFooter);
  });

  // ==========================================================================
  // DOCUMENT STYLING APPLIER
  // ==========================================================================
  function applyPaperStyles() {
    out.style.setProperty('--doc-ff', $('fontFamily').value);
    out.style.setProperty('--doc-fs', $('fontSize').value + 'px');
    out.style.setProperty('--doc-lh', $('lineHeight').value);
    out.style.setProperty('--doc-acc', $('colPrimary').value);
    out.style.setProperty('--doc-hd', $('colHeadings').value);
    out.style.setProperty('--doc-txt', $('colText').value);
    out.style.setProperty('--doc-lk', $('colLinks').value);
    renderHeaderFooter();
  }

  ['fontFamily', 'fontSize', 'lineHeight', 'colPrimary', 'colHeadings', 'colText', 'colLinks'].forEach(id => {
    $(id).addEventListener('input', applyPaperStyles);
  });

  $('docThemeSelect').addEventListener('change', e => {
    out.className = 'paper ' + e.target.value;
    applyPaperStyles();
    showToast(`Applied ${e.target.selectedOptions[0].text}`);
  });

  $('btnResetStyles').addEventListener('click', () => {
    $('fontFamily').value = "'Plus Jakarta Sans', sans-serif";
    $('fontSize').value = "14.5";
    $('lineHeight').value = "1.7";
    $('colPrimary').value = "#6366f1";
    $('colHeadings').value = "#111827";
    $('colText').value = "#1f2937";
    $('colLinks').value = "#2563eb";
    $('docThemeSelect').value = "theme-modern";
    out.className = 'paper theme-modern';
    applyPaperStyles();
    showToast('Styles reset to defaults');
  });

  // ==========================================================================
  // VIEW MODE & APP THEME TOGGLES
  // ==========================================================================
  const ws = $('workspace');
  $('btnViewSplit').onclick = () => {
    ws.className = 'workspace';
    $('btnViewSplit').classList.add('active');
    $('btnViewEditor').classList.remove('active');
    $('btnViewPreview').classList.remove('active');
  };
  $('btnViewEditor').onclick = () => {
    ws.className = 'workspace view-editor';
    $('btnViewSplit').classList.remove('active');
    $('btnViewEditor').classList.add('active');
    $('btnViewPreview').classList.remove('active');
  };
  $('btnViewPreview').onclick = () => {
    ws.className = 'workspace view-preview';
    $('btnViewSplit').classList.remove('active');
    $('btnViewEditor').classList.remove('active');
    $('btnViewPreview').classList.add('active');
  };

  // App Dark/Light Mode
  $('btnToggleTheme').onclick = () => {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const nextTheme = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nextTheme);
    $('themeIconSun').style.display = isDark ? 'none' : 'block';
    $('themeIconMoon').style.display = isDark ? 'block' : 'none';
    try { localStorage.setItem('mdstudio_app_theme', nextTheme); } catch(e){}
  };

  // Load saved theme preference
  try {
    const savedTheme = localStorage.getItem('mdstudio_app_theme');
    if (savedTheme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      $('themeIconSun').style.display = 'none';
      $('themeIconMoon').style.display = 'block';
    }
  } catch(e){}

  // Settings Drawer Toggle
  const drawer = $('settingsDrawer');
  $('btnToggleSettings').onclick = () => drawer.classList.toggle('open');
  $('btnCloseSettings').onclick = () => drawer.classList.remove('open');

  // Export dropdown toggle
  const exportDropdown = $('exportDropdown');
  $('btnExportMenu').onclick = e => {
    e.stopPropagation();
    exportDropdown.classList.toggle('open');
  };
  document.addEventListener('click', () => exportDropdown.classList.remove('open'));

  // ==========================================================================
  // FORMATTING TOOLBAR HELPERS
  // ==========================================================================
  function insertWrap(before, after = '', placeholder = '') {
    const start = src.selectionStart;
    const end = src.selectionEnd;
    const val = src.value;
    const selected = val.substring(start, end) || placeholder;

    src.value = val.substring(0, start) + before + selected + after + val.substring(end);
    src.focus();
    src.selectionStart = start + before.length;
    src.selectionEnd = start + before.length + selected.length;
    renderDocument();
  }

  function insertBlockPrefix(prefix) {
    const start = src.selectionStart;
    const val = src.value;
    const lineStart = val.lastIndexOf('\n', start - 1) + 1;
    src.value = val.substring(0, lineStart) + prefix + val.substring(lineStart);
    src.focus();
    src.selectionStart = src.selectionEnd = start + prefix.length;
    renderDocument();
  }

  $('fmtBold').onclick = () => insertWrap('**', '**', 'bold text');
  $('fmtItalic').onclick = () => insertWrap('*', '*', 'italic text');
  $('fmtStrike').onclick = () => insertWrap('~~', '~~', 'strikethrough');
  $('fmtCode').onclick = () => insertWrap('`', '`', 'code');
  $('fmtH1').onclick = () => insertBlockPrefix('# ');
  $('fmtH2').onclick = () => insertBlockPrefix('## ');
  $('fmtH3').onclick = () => insertBlockPrefix('### ');
  $('fmtUl').onclick = () => insertBlockPrefix('- ');
  $('fmtOl').onclick = () => insertBlockPrefix('1. ');
  $('fmtTask').onclick = () => insertBlockPrefix('- [ ] ');
  $('fmtQuote').onclick = () => insertBlockPrefix('> ');
  $('fmtCodeBlock').onclick = () => insertWrap('```javascript\n', '\n```', '// your code here');
  $('fmtPageBreak').onclick = () => insertWrap('\n<!-- pagebreak -->\n');
  $('fmtTable').onclick = () => insertWrap('\n| Column 1 | Column 2 | Column 3 |\n|---|---|---|\n| Item A | Data 1 | Active |\n| Item B | Data 2 | Complete |\n\n');

  // Math, Diagram & Media Ribbon Actions
  $('fmtMath').onclick = () => {
    const start = src.selectionStart;
    const end = src.selectionEnd;
    const sel = src.value.substring(start, end);
    if (sel.includes('\n')) {
      insertWrap('$$\n', '\n$$', '\\sigma = \\sqrt{\\frac{1}{N}\\sum_{i=1}^N (x_i - \\mu)^2}');
    } else if (sel.length > 0) {
      insertWrap('$', '$');
    } else {
      insertWrap('\n$$\n', '\n$$\n', 'f(x) = \\int_{-\\infty}^\\infty \\hat f(\\xi)\\,e^{2 \\pi i \\xi x}\\,d\\xi');
    }
  };

  $('fmtMermaid').onclick = () => {
    insertWrap('\n```mermaid\ngraph TD\n    A[Start] --> B{Action}\n    B -->|Success| C[Completed]\n    B -->|Pending| D[Follow-up]\n    D --> B\n```\n');
  };

  const imgUploadInput = $('imgUploadInput');
  $('fmtImage').onclick = () => {
    imgUploadInput.click();
  };
  imgUploadInput.addEventListener('change', async e => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    showToast(`Embedding ${files.length} image(s)…`);
    for (const f of files) {
      try {
        const base64 = await processImageFile(f);
        const name = f.name.replace(/\.[^/.]+$/, '');
        insertWrap(`\n![${name}](${base64})\n`);
      } catch(err) {
        console.error(err);
      }
    }
    showToast(`Embedded ${files.length} image(s)`);
    e.target.value = '';
  });

  // Keyboard Shortcuts in Editor (Tab/Shift+Tab indent, Ctrl+S, Ctrl+B, Ctrl+I, Ctrl+K, Ctrl+M)
  src.addEventListener('keydown', e => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = src.selectionStart;
      const end = src.selectionEnd;
      if (e.shiftKey) {
        const lineStart = src.value.lastIndexOf('\n', start - 1) + 1;
        const lineSub = src.value.substring(lineStart, lineStart + 2);
        if (lineSub === '  ') {
          src.value = src.value.substring(0, lineStart) + src.value.substring(lineStart + 2);
          src.selectionStart = Math.max(lineStart, start - 2);
          src.selectionEnd = Math.max(lineStart, end - 2);
          renderDocument();
        } else if (lineSub.startsWith(' ') || lineSub.startsWith('\t')) {
          src.value = src.value.substring(0, lineStart) + src.value.substring(lineStart + 1);
          src.selectionStart = Math.max(lineStart, start - 1);
          src.selectionEnd = Math.max(lineStart, end - 1);
          renderDocument();
        }
        return;
      }
      src.value = src.value.substring(0, start) + '  ' + src.value.substring(end);
      src.selectionStart = src.selectionEnd = start + 2;
      renderDocument();
      return;
    }

    if (e.ctrlKey || e.metaKey) {
      const k = e.key.toLowerCase();
      if (k === 's') {
        e.preventDefault();
        try {
          localStorage.setItem('mdstudio_content', src.value);
          localStorage.setItem('mdstudio_title', docTitle.value);
          showToast('Saved locally (Ctrl+S)');
        } catch (err) {
          showToast('Local save error');
        }
      } else if (k === 'b') {
        e.preventDefault();
        $('fmtBold').click();
      } else if (k === 'i') {
        e.preventDefault();
        $('fmtItalic').click();
      } else if (k === 'k') {
        e.preventDefault();
        insertWrap('[', '](https://example.com)', 'link text');
      } else if (k === 'm') {
        e.preventDefault();
        $('fmtMath').click();
      }
    }
  });

  // ==========================================================================
  // BEAUTIFY & SMART ACTIONS
  // ==========================================================================
  function mutateSource(newText, msg) {
    prevHistory = src.value;
    src.value = newText;
    $('btnUndo').disabled = false;
    renderDocument();
    showToast(msg);
  }

  $('btnUndo').onclick = () => {
    if (prevHistory === null) return;
    const curr = src.value;
    src.value = prevHistory;
    prevHistory = curr;
    renderDocument();
    showToast('Undo completed');
  };

  function outsideCodeFences(text, fn) {
    let inFence = false;
    return text.split('\n').map(line => {
      if (/^\s*(```|~~~)/.test(line)) {
        inFence = !inFence;
        return line;
      }
      return inFence ? line : fn(line);
    }).join('\n');
  }

  // Tidy action
  $('btnTidy').onclick = () => {
    let t = src.value.replace(/\r\n?/g, '\n');
    let lines = outsideCodeFences(t, l => l.replace(/[ \t]+$/, '').replace(/^(\s*)[*+]\s+/, '$1- ').replace(/^(#{1,6})([^\s#])/, '$1 $2'));
    let arr = lines.split('\n'), res = [], inFence = false;
    arr.forEach((l, i) => {
      if (/^\s*(```|~~~)/.test(l)) inFence = !inFence;
      const isH = !inFence && /^#{1,6}\s/.test(l);
      if (isH && res.length && res[res.length - 1].trim() !== '') res.push('');
      res.push(l);
      if (isH && arr[i + 1] !== undefined && arr[i + 1].trim() !== '') res.push('');
    });
    mutateSource(res.join('\n').replace(/\n{3,}/g, '\n\n').trim() + '\n', 'Document tidied');
  };

  // Typography action
  $('btnTypo').onclick = () => {
    const t = outsideCodeFences(src.value, l => {
      return l.split(/(`[^`]*`|\]\([^)]*\)|https?:\/\/\S+)/).map((p, i) => {
        if (i % 2) return p;
        return p.replace(/\.\.\./g, '…')
                .replace(/ -- /g, ' – ')
                .replace(/ --- /g, ' — ')
                .replace(/(^|[\s(\[])"/g, '$1“')
                .replace(/"/g, '”')
                .replace(/(^|[\s(\[])'/g, '$1‘')
                .replace(/'/g, '’');
      }).join('');
    });
    mutateSource(t, 'Typography enhanced');
  };

  // Table of Contents generator
  $('btnToc').onclick = () => {
    let t = src.value.replace(/<!-- toc -->[\s\S]*?<!-- \/toc -->\n*/, '');
    const items = [];
    const seenSlugs = {};
    let inFence = false;

    t.split('\n').forEach(line => {
      if (/^\s*(```|~~~)/.test(line)) inFence = !inFence;
      const m = !inFence && line.match(/^(#{2,4})\s+(.*)$/);
      if (m) {
        const titleText = m[2].replace(/[*_`]/g, '').trim();
        let s = slugify(titleText) || 'section';
        seenSlugs[s] = (seenSlugs[s] || 0) + 1;
        const anchor = seenSlugs[s] > 1 ? `${s}-${seenSlugs[s]}` : s;
        const indent = '  '.repeat(m[1].length - 2);
        items.push(`${indent}- [${titleText}](#${anchor})`);
      }
    });

    if (!items.length) {
      showToast('No H2 or H3 headings found to build TOC');
      return;
    }

    const tocBlock = `<!-- toc -->\n## Table of Contents\n\n${items.join('\n')}\n<!-- /toc -->\n\n`;
    const h1Match = t.match(/^# .*\n+/);
    const newText = h1Match ? t.replace(h1Match[0], h1Match[0] + tocBlock) : tocBlock + t;
    mutateSource(newText, 'Table of contents generated');
  };

  $('btnSample').onclick = () => mutateSource(SAMPLE_DOC, 'Loaded sample document');
  $('btnClear').onclick = () => {
    if (confirm('Clear the entire document?')) {
      mutateSource('', 'Document cleared');
    }
  };
  $('btnCopyMd').onclick = () => {
    navigator.clipboard.writeText(src.value);
    showToast('Markdown copied to clipboard');
  };

  // ==========================================================================
  // UNIVERSAL EXPORTS (STANDALONE CLIENT-SIDE DOWNLOADS)
  // ==========================================================================
  function sanitizeFilename(name) {
    return (name || 'document').replace(/[^\w\-\.]+/g, '_').trim() || 'document';
  }

  function getCleanFileName(ext) {
    const base = sanitizeFilename(docTitle.value || 'document');
    return `${base}.${ext}`;
  }

  // Universal Save Helper: works in ANY standard browser via Blob + <a> download
  async function universalDownload(filename, data, mimeType) {
    try {
      const blob = data instanceof Blob ? data : new Blob([data], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }, 1000);
      showToast(`Exported ${filename}`);
    } catch (err) {
      console.error('Download error:', err);
      showToast('Export failed. Check browser permissions.');
    }
  }

  // Generate Standalone HTML Document
  function generateStandaloneHtml() {
    const title = escapeHtml(docTitle.value || 'Document');
    const bodyContent = out.innerHTML;
    const computedStyle = getComputedStyle(out);

    return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${title}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&family=Lora:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<style>
  body {
    max-width: 820px;
    margin: 40px auto;
    padding: 0 24px;
    font-family: ${computedStyle.getPropertyValue('--doc-ff') || 'system-ui, sans-serif'};
    font-size: ${computedStyle.getPropertyValue('--doc-fs') || '15px'};
    line-height: ${computedStyle.getPropertyValue('--doc-lh') || '1.7'};
    color: ${computedStyle.getPropertyValue('--doc-txt') || '#1f2937'};
    background: #ffffff;
  }
  h1, h2, h3, h4 { color: ${computedStyle.getPropertyValue('--doc-hd') || '#111827'}; line-height: 1.3; }
  h1 { font-size: 2.2em; border-bottom: 2px solid ${computedStyle.getPropertyValue('--doc-acc') || '#6366f1'}; padding-bottom: 0.3em; }
  h2 { font-size: 1.6em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.2em; margin-top: 1.5em; }
  table { width: 100%; border-collapse: collapse; margin: 1.5em 0; }
  th, td { border: 1px solid #e5e7eb; padding: 8px 12px; text-align: left; }
  th { background: #f8fafc; }
  blockquote { border-left: 4px solid ${computedStyle.getPropertyValue('--doc-acc') || '#6366f1'}; padding: 6px 14px; background: #f8fafc; margin: 1em 0; font-style: italic; }
  code { font-family: 'JetBrains Mono', monospace; background: #f1f5f9; padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }
  pre { background: #1e1e2e !important; color: #f8fafc; padding: 14px 18px; border-radius: 6px; overflow-x: auto; margin: 1.4em 0; }
  pre code { background: none !important; color: inherit; padding: 0 !important; }
  img { max-width: 100%; height: auto; border-radius: 6px; margin: 1.4em auto; display: block; }
  .callout { padding: 12px 16px; margin: 1.2em 0; border-radius: 6px; border-left: 4px solid; font-size: 0.95em; }
  .callout-title { font-weight: 700; text-transform: uppercase; font-size: 0.82em; letter-spacing: 0.05em; margin-bottom: 4px; }
  .callout-note { background: #eff6ff; border-color: #3b82f6; color: #1e3a8a; }
  .callout-tip { background: #ecfdf5; border-color: #10b981; color: #064e3b; }
  .callout-important { background: #f5f3ff; border-color: #8b5cf6; color: #4c1d95; }
  .callout-warning { background: #fffbeb; border-color: #f59e0b; color: #78350f; }
  .callout-caution { background: #fef2f2; border-color: #ef4444; color: #7f1d1d; }
  .math-display { margin: 1.4em 0; text-align: center; overflow-x: auto; }
  .math-inline { display: inline-block; padding: 0 2px; }
  .mermaid-chart { display: flex; justify-content: center; align-items: center; margin: 1.8em 0; overflow-x: auto; }
  .mermaid-chart svg { max-width: 100% !important; height: auto !important; }
  @media print { body { max-width: 100%; margin: 0; padding: 0; } }
</style>
</head>
<body>
${bodyContent}
</body>
</html>`;
  }

  // Export Button Bindings
  $('btnExportMd').onclick = () => universalDownload(getCleanFileName('md'), src.value, 'text/markdown;charset=utf-8');
  $('btnExportHtml').onclick = () => universalDownload(getCleanFileName('html'), generateStandaloneHtml(), 'text/html;charset=utf-8');
  $('btnCopyHtml').onclick = () => {
    navigator.clipboard.writeText(generateStandaloneHtml());
    showToast('HTML copied to clipboard');
  };

  // Trigger Vector Print / PDF Export (Instant, 100% Vector Quality, No Page Limits)
  function triggerVectorPdfPrint() {
    showToast('Opening PDF Print dialog — in Destination, choose "Save as PDF"');
    setTimeout(() => {
      window.print();
    }, 200);
  }

  $('btnQuickPdf').onclick = triggerVectorPdfPrint;
  $('btnPrint').onclick = triggerVectorPdfPrint;

  // Keyboard shortcut Ctrl+P / Cmd+P triggers clean Vector PDF print
  window.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') {
      e.preventDefault();
      triggerVectorPdfPrint();
    }
  });

  // Direct PDF Download / Smart Handler
  $('btnExportPdf').onclick = async () => {
    const estPages = Math.max(1, Math.ceil(out.scrollHeight / 1050));
    // For large documents (e.g. over 12 pages), canvas rendering exceeds browser limits
    // and causes blank pages. Automatically route to pristine Vector PDF (Save as PDF).
    if (out.scrollHeight > 14000) {
      showToast(`Document has ~${estPages} pages. Opening Vector PDF dialog — select "Save as PDF" for crystal-clear vector text.`);
      setTimeout(() => { window.print(); }, 350);
      return;
    }

    const btn = $('btnExportPdf');
    btn.disabled = true;
    showToast('Generating PDF document…');

    const pageSize = $('pageSize').value || 'a4';
    const { header, footer } = getHFLayout();
    const hasHeader = header.L || header.C || header.R;
    const hasFooter = footer.L || footer.C || footer.R;
    const hideFirst = $('chkHideFirstPage').checked;

    const opt = {
      margin: [hasHeader ? 22 : 14, 14, hasFooter ? 22 : 14, 14],
      filename: getCleanFileName('pdf'),
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 1.5, useCORS: true },
      jsPDF: { unit: 'mm', format: pageSize, orientation: 'portrait' },
      pagebreak: { mode: ['css', 'legacy'], avoid: ['h1', 'h2', 'h3', 'tr', 'pre', 'blockquote', '.callout'] }
    };

    try {
      const worker = html2pdf().set(opt).from(out);
      const pdfBlob = await worker.toPdf().get('pdf').then(pdf => {
        const total = pdf.internal.getNumberOfPages();
        const pageW = pdf.internal.pageSize.getWidth();
        const pageH = pdf.internal.pageSize.getHeight();
        pdf.setFontSize(9);
        pdf.setTextColor(110);

        for (let i = 1; i <= total; i++) {
          if (i === 1 && hideFirst) continue;
          pdf.setPage(i);
          if (header.L) pdf.text(fillPageNos(header.L, i, total), 14, 11);
          if (header.C) pdf.text(fillPageNos(header.C, i, total), pageW / 2, 11, { align: 'center' });
          if (header.R) pdf.text(fillPageNos(header.R, i, total), pageW - 14, 11, { align: 'right' });

          if (footer.L) pdf.text(fillPageNos(footer.L, i, total), 14, pageH - 10);
          if (footer.C) pdf.text(fillPageNos(footer.C, i, total), pageW / 2, pageH - 10, { align: 'center' });
          if (footer.R) pdf.text(fillPageNos(footer.R, i, total), pageW - 14, pageH - 10, { align: 'right' });
        }
        return pdf;
      }).outputPdf('blob');

      if (pdfBlob && pdfBlob.size > 5000) {
        await universalDownload(getCleanFileName('pdf'), pdfBlob, 'application/pdf');
      } else {
        showToast('Document exceeded canvas memory limits. Switching to Vector Print-to-PDF…');
        setTimeout(() => { window.print(); }, 400);
      }
    } catch (e) {
      console.warn('Direct PDF export error, switching to Print:', e);
      showToast('Switched to Vector Print-to-PDF (Save as PDF)…');
      setTimeout(() => { window.print(); }, 400);
    } finally {
      btn.disabled = false;
    }
  };

  // Word (.docx) Export using html-docx-js + JSZip
  const makeField = c => `<w:r><w:rPr><w:color w:val="6E6E6E"/><w:sz w:val="18"/></w:rPr><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:rPr><w:color w:val="6E6E6E"/><w:sz w:val="18"/></w:rPr><w:instrText xml:space="preserve"> ${c} </w:instrText></w:r><w:r><w:rPr><w:color w:val="6E6E6E"/><w:sz w:val="18"/></w:rPr><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:rPr><w:color w:val="6E6E6E"/><w:sz w:val="18"/></w:rPr><w:t>1</w:t></w:r><w:r><w:rPr><w:color w:val="6E6E6E"/><w:sz w:val="18"/></w:rPr><w:fldChar w:fldCharType="end"/></w:r>`;
  const makeDocxRuns = t => t.split(/(\{n\}|\{N\})/).map(p => p === '{n}' ? makeField('PAGE') : p === '{N}' ? makeField('NUMPAGES') : p ? `<w:r><w:rPr><w:color w:val="6E6E6E"/><w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">${escapeHtml(p)}</w:t></w:r>` : '').join('');
  const makeDocxPart = (tag, obj, width) => `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:${tag} xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:p><w:pPr><w:tabs><w:tab w:val="center" w:pos="${width / 2}"/><w:tab w:val="right" w:pos="${width}"/></w:tabs></w:pPr>${makeDocxRuns(obj.L)}<w:r><w:tab/></w:r>${makeDocxRuns(obj.C)}<w:r><w:tab/></w:r>${makeDocxRuns(obj.R)}</w:p></w:${tag}>`;

  $('btnExportDocx').onclick = async () => {
    showToast('Building Word document…');
    try {
      const rawHtml = generateStandaloneHtml();
      const blob = htmlDocx.asBlob(rawHtml);
      const { header, footer } = getHFLayout();
      const hasHeader = header.L || header.C || header.R;
      const hasFooter = footer.L || footer.C || footer.R;
      const isA4 = $('pageSize').value === 'a4';

      if (!hasHeader && !hasFooter && !isA4) {
        await universalDownload(getCleanFileName('docx'), blob, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
        return;
      }

      const zip = await JSZip.loadAsync(await blob.arrayBuffer());
      const width = isA4 ? 9026 : 9360;
      let docXml = await zip.file('word/document.xml').async('string');
      let contentTypes = await zip.file('[Content_Types].xml').async('string');
      let rels = await zip.file('word/_rels/document.xml.rels').async('string');
      let refs = '';

      if (isA4) docXml = docXml.replace('w:w="12240" w:h="15840"', 'w:w="11906" w:h="16838"');

      const REL_TYPE = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships/';
      const CONTENT_TYPE = 'application/vnd.openxmlformats-officedocument.wordprocessingml.';

      [['hdr', 'header', header], ['ftr', 'footer', footer]].forEach(([tag, name, obj]) => {
        if (!obj.L && !obj.C && !obj.R) return;
        zip.file(`word/${name}1.xml`, makeDocxPart(tag, obj, width));
        refs += `<w:${name}Reference w:type="default" r:id="${tag}1"/>`;
        contentTypes = contentTypes.replace('</Types>', `<Override PartName="/word/${name}1.xml" ContentType="${CONTENT_TYPE}${name}+xml"/></Types>`);
        rels = rels.replace('</Relationships>', `<Relationship Type="${REL_TYPE}${name}" Target="/word/${name}1.xml" Id="${tag}1"/></Relationships>`);
      });

      docXml = docXml.replace('<w:sectPr>', `<w:sectPr>${refs}`);
      if ($('chkHideFirstPage').checked && refs) {
        docXml = docXml.replace('</w:sectPr>', '<w:titlePg/></w:sectPr>');
      }

      zip.file('word/document.xml', docXml);
      zip.file('[Content_Types].xml', contentTypes);
      zip.file('word/_rels/document.xml.rels', rels);

      const modifiedBlob = await zip.generateAsync({
        type: 'blob',
        mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
      });

      await universalDownload(getCleanFileName('docx'), modifiedBlob, 'application/vnd.openxmlformats-officedocument.wordprocessingml.document');
    } catch (e) {
      console.error(e);
      showToast('Word export failed');
    }
  };

  // ==========================================================================
  // FILE & IMAGE DRAG, DROP, PASTE AND OPEN
  // ==========================================================================
  // Image Processing & Compression Helper (Auto-Base64)
  function processImageFile(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = e => {
        const dataUrl = e.target.result;
        // Keep vector SVGs or GIFs uncompressed, or small images under 350KB
        if (file.type === 'image/svg+xml' || file.type === 'image/gif' || file.size < 350 * 1024) {
          return resolve(dataUrl);
        }
        // Downscale large photos to max 1600px dimension for performance & clean storage
        const img = new Image();
        img.onload = () => {
          const MAX_DIM = 1600;
          let w = img.width;
          let h = img.height;
          if (w > MAX_DIM || h > MAX_DIM) {
            if (w > h) {
              h = Math.round((h * MAX_DIM) / w);
              w = MAX_DIM;
            } else {
              w = Math.round((w * MAX_DIM) / h);
              h = MAX_DIM;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const mime = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
          resolve(canvas.toDataURL(mime, 0.88));
        };
        img.onerror = () => resolve(dataUrl);
        img.src = dataUrl;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Paste image directly from clipboard
  src.addEventListener('paste', async e => {
    const items = (e.clipboardData || window.clipboardData)?.items;
    if (!items) return;
    for (let i = 0; i < items.length; i++) {
      if (items[i].type.indexOf('image') !== -1) {
        e.preventDefault();
        const file = items[i].getAsFile();
        if (!file) continue;
        showToast('Embedding clipboard image…');
        try {
          const base64 = await processImageFile(file);
          const timestamp = new Date().toISOString().slice(0, 19).replace('T', '_').replace(/:/g, '-');
          insertWrap(`\n![Screenshot ${timestamp}](${base64})\n`);
          showToast('Image embedded from clipboard');
        } catch (err) {
          console.error(err);
          showToast('Failed to process pasted image');
        }
        return;
      }
    }
  });

  $('fileInput').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      docTitle.value = file.name.replace(/\.[^/.]+$/, '');
      mutateSource(text, `Loaded ${file.name}`);
    } catch(err) {
      showToast('Error reading file');
    }
    e.target.value = '';
  });

  // Drag and drop onto editor (Files and Images)
  const editorPane = document.querySelector('.editor-pane');
  ['dragenter', 'dragover'].forEach(name => {
    src.addEventListener(name, e => {
      e.preventDefault();
      editorPane?.classList.add('drag-active');
    });
  });
  ['dragleave', 'drop'].forEach(name => {
    src.addEventListener(name, e => {
      e.preventDefault();
      editorPane?.classList.remove('drag-active');
    });
  });
  src.addEventListener('drop', async e => {
    const files = e.dataTransfer.files;
    if (!files || !files.length) return;

    const first = files[0];
    if (first.name.endsWith('.md') || first.name.endsWith('.txt') || first.name.endsWith('.markdown')) {
      const text = await first.text();
      docTitle.value = first.name.replace(/\.[^/.]+$/, '');
      mutateSource(text, `Imported ${first.name}`);
      return;
    }

    const imageFiles = Array.from(files).filter(f => f.type.startsWith('image/'));
    if (imageFiles.length) {
      showToast(`Embedding ${imageFiles.length} image(s)…`);
      for (const img of imageFiles) {
        try {
          const base64 = await processImageFile(img);
          const cleanName = img.name.replace(/\.[^/.]+$/, '');
          insertWrap(`\n![${cleanName}](${base64})\n`);
        } catch(err) {
          console.error(err);
        }
      }
      showToast(`Embedded ${imageFiles.length} image(s) as Base64`);
    }
  });

  // Synchronized Scrolling
  const previewScrollWrapper = $('previewWrapper');
  let isEditorScrolling = false;
  let isPreviewScrolling = false;

  src.addEventListener('scroll', () => {
    if (isPreviewScrolling) return;
    isEditorScrolling = true;
    const ratio = src.scrollTop / (src.scrollHeight - src.clientHeight || 1);
    previewScrollWrapper.scrollTop = ratio * (previewScrollWrapper.scrollHeight - previewScrollWrapper.clientHeight);
    setTimeout(() => { isEditorScrolling = false; }, 50);
  });

  previewScrollWrapper.addEventListener('scroll', () => {
    if (isEditorScrolling) return;
    isPreviewScrolling = true;
    const ratio = previewScrollWrapper.scrollTop / (previewScrollWrapper.scrollHeight - previewScrollWrapper.clientHeight || 1);
    src.scrollTop = ratio * (src.scrollHeight - src.clientHeight);
    setTimeout(() => { isPreviewScrolling = false; }, 50);
  });

  // Initial Render
  renderDocument();
  applyPaperStyles();
})();
</script>
</body>
</html>
